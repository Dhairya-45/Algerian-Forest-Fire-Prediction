<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Algerian Forest Fire Prediction</title>

    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(120deg, #ff512f, #dd2476);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            width: 480px;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 6px;
        }

        p {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 13px;
        }

        button {
            margin-top: 22px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(120deg, #ff512f, #dd2476);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .result {
            margin-top: 22px;
            padding: 15px;
            border-radius: 10px;
            background: #f4f4f4;
            text-align: center;
            font-size: 17px;
            font-weight: bold;
            color: #2c3e50;
        }

        .risk {
            margin-top: 6px;
            font-size: 15px;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>🔥 Forest Fire Predictor</h1>
    <p>Algerian Forest Fire Dataset – Fire Weather Index (FWI)</p>

    <form action="/predictdata" method="POST">

        <div class="grid">
            <div>
                <label>Temperature (°C)</label>
                <input type="number" step="any" name="Temperature" required>
            </div>

            <div>
                <label>Relative Humidity (%)</label>
                <input type="number" step="any" name="RH" required>
            </div>

            <div>
                <label>Wind Speed (Ws)</label>
                <input type="number" step="any" name="Ws" required>
            </div>

            <div>
                <label>Rain (mm)</label>
                <input type="number" step="any" name="Rain" required>
            </div>

            <div>
                <label>FFMC</label>
                <input type="number" step="any" name="FFMC" required>
            </div>

            <div>
                <label>DMC</label>
                <input type="number" step="any" name="DMC" required>
            </div>

            <div>
                <label>ISI</label>
                <input type="number" step="any" name="ISI" required>
            </div>

            <div>
                <label>Classes (0 / 1)</label>
                <input type="number" name="Classes" min="0" max="1" required>
            </div>

            <div>
                <label>Region (0 / 1)</label>
                <input type="number" name="Region" min="0" max="1" required>
            </div>
        </div>

        <button type="submit">Predict FWI</button>
    </form>

    {% if result %}
    <div class="result">
        🔥 Predicted FWI: {{ result }}
        <div class="risk">{{ risk }}</div>
    </div>
    {% endif %}

</div>

</body>
</html>
